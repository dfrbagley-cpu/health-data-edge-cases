<!-- Export at 1280x640, for example: inkscape docs/social-card.svg --export-filename=docs/social-card.png --export-width=1280 --export-height=640 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Health Data Edge Cases</title>
  <desc id="description">Catch plausible-but-wrong healthcare reporting logic. Five synthetic cases, 72 expectations, with Python, SQL, and R reference implementations.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#073f47"/>
      <stop offset="1" stop-color="#0d6572"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5bc0c9" stop-opacity=".34"/>
      <stop offset="1" stop-color="#5bc0c9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1135" cy="82" r="360" fill="url(#glow)"/>
  <circle cx="1160" cy="585" r="290" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="2"/>
  <circle cx="1160" cy="585" r="205" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="2"/>

  <g transform="translate(78 68)" font-family="DejaVu Sans, Arial, sans-serif">
    <rect width="66" height="66" rx="14" fill="#e7f4f5"/>
    <text x="33" y="43" fill="#084c55" font-size="22" font-weight="700" text-anchor="middle">HD</text>
    <text x="86" y="29" fill="#ffffff" font-size="29" font-weight="700">Health Data Edge Cases</text>
    <text x="86" y="57" fill="#bde1e4" font-size="15" font-weight="700" letter-spacing="2.2">SYNTHETIC CONFORMANCE SUITE</text>
  </g>

  <g transform="translate(78 220)" font-family="DejaVu Sans, Arial, sans-serif">
    <text fill="#ffffff" font-size="61" font-weight="700" letter-spacing="-1.7">
      <tspan x="0" y="0">Catch plausible-but-wrong</tspan>
      <tspan x="0" y="75">healthcare reporting logic.</tspan>
    </text>
    <text x="0" y="133" fill="#d6e8ea" font-size="24">
      Small known-answer tests for numbers that look reasonable—and are still wrong.
    </text>
  </g>

  <g transform="translate(78 467)" font-family="DejaVu Sans, Arial, sans-serif">
    <rect width="850" height="92" rx="14" fill="#ffffff" fill-opacity=".10" stroke="#ffffff" stroke-opacity=".22"/>
    <text x="28" y="38" fill="#9bdce1" font-size="15" font-weight="700" letter-spacing="1.7">VERIFIED PUBLIC CONTRACTS</text>
    <text x="28" y="68" fill="#ffffff" font-size="24" font-weight="700">5 synthetic cases · 72 expectations · Python · SQL · R</text>
  </g>

  <g transform="translate(985 417)" font-family="DejaVu Sans, Arial, sans-serif">
    <rect width="214" height="142" rx="16" fill="#ffffff" fill-opacity=".10" stroke="#ffffff" stroke-opacity=".22"/>
    <text x="24" y="35" fill="#bde1e4" font-size="14" font-weight="700" letter-spacing="1.5">PLAUSIBLE NUMBER</text>
    <text x="24" y="85" fill="#ffffff" font-size="42" font-weight="700">PASS?</text>
    <line x1="24" y1="105" x2="190" y2="105" stroke="#f4c95d" stroke-width="4"/>
    <text x="24" y="128" fill="#f8df91" font-size="15" font-weight="700">CHECK THE CONTRACT</text>
  </g>

  <text x="1202" y="606" fill="#b7d2d5" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="end">Synthetic data only · Apache-2.0</text>
</svg>
