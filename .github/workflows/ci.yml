name: Conformance suite

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-reference:
    name: Python ${{ matrix.python-version }} and portable SQL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned DuckDB reference
        run: python -m pip install duckdb==1.5.5
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run conformance suite
        run: python scripts/run_suite.py
      - name: Run portable SQL in DuckDB
        run: python scripts/run_duckdb.py
      - name: Verify committed report
        run: python scripts/build_report.py --check
      - name: Verify canonical contract catalog
        run: python scripts/build_contract_catalog.py --check

  release-assets:
    name: Deterministic release assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned build tools
        run: python -m pip install build==1.5.0 hatchling==1.31.0
      - name: Resolve the exact deterministic-build timestamp
        id: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          test "$SOURCE_DATE_EPOCH" -ge 315532800
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          echo "epoch=$SOURCE_DATE_EPOCH" >> "$GITHUB_OUTPUT"
      - name: Build and validate exactly five release files
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python scripts/build_release_assets.py \
            --output-dir release-dist \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --workflow-run-id "$WORKFLOW_RUN_ID"
          test "$(find release-dist -maxdepth 1 -type f | wc -l)" -eq 5
          (cd release-dist && sha256sum --check SHA256SUMS)
      - name: Upload the exact-commit release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.sha }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  wheel-smoke:
    name: Exact wheel smoke test (Python ${{ matrix.python-version }})
    needs: release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download the exact artifact built by this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ github.sha }}
          path: release-dist
      - name: Install and run the exact wheel outside the source tree
        run: |
          set -euo pipefail
          test "$(find release-dist -maxdepth 1 -name '*.whl' -type f | wc -l)" -eq 1
          wheel="$(realpath "$(find release-dist -maxdepth 1 -name '*.whl' -type f)")"
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install duckdb==1.5.5 "$wheel"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/health-data-edge-cases"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m health_edge_cases --json > wheel-result.json
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m health_edge_cases.duckdb_runner
          "$RUNNER_TEMP/wheel-smoke/bin/health-data-edge-cases" --help | grep -F "compare"
          "$RUNNER_TEMP/wheel-smoke/bin/python" - <<'PY'
          import csv
          from pathlib import Path

          from health_edge_cases.runner import DEFAULT_CASES_DIR

          case_dir = DEFAULT_CASES_DIR / "unmapped-program-retention"
          output_dir = Path("external-results")
          output_dir.mkdir()
          for expected_name, actual_name, columns in (
              (
                  "expected_metrics.csv",
                  "actual_metrics.csv",
                  ("period_id", "metric_id", "actual_value"),
              ),
              (
                  "expected_quality.csv",
                  "actual_quality.csv",
                  ("check_id", "actual_value"),
              ),
          ):
              with (case_dir / expected_name).open(
                  encoding="utf-8", newline=""
              ) as source:
                  rows = list(csv.DictReader(source))
              with (output_dir / actual_name).open(
                  "w", encoding="utf-8", newline=""
              ) as target:
                  writer = csv.DictWriter(target, fieldnames=columns)
                  writer.writeheader()
                  for row in rows:
                      writer.writerow(
                          {
                              **{column: row[column] for column in columns[:-1]},
                              "actual_value": row["expected_value"],
                          }
                      )
          PY
          "$RUNNER_TEMP/wheel-smoke/bin/health-data-edge-cases" compare \
            --case unmapped-program-retention \
            --metrics external-results/actual_metrics.csv \
            --quality external-results/actual_quality.csv \
            --json > wheel-compare.json
          "$RUNNER_TEMP/wheel-smoke/bin/python" - <<'PY'
          import json
          from pathlib import Path

          import health_edge_cases
          from health_edge_cases.contracts import build_catalog, validate_catalog

          result = json.loads(Path("wheel-result.json").read_text(encoding="utf-8"))
          comparison = json.loads(
              Path("wheel-compare.json").read_text(encoding="utf-8")
          )
          catalog = build_catalog()
          validate_catalog(catalog)
          assert health_edge_cases.__version__ == "0.3.2"
          assert result["passed"] is True
          assert comparison["passed"] is True
          assert isinstance(comparison["actual_metrics"][0]["value"], str)
          assert catalog["suite_version"] == health_edge_cases.__version__
          assert len(catalog["cases"]) == 5
          assert sum(
              len(case["metrics"]) + len(case["quality"])
              for case in catalog["cases"]
          ) == 72
          PY

  attest-release-assets:
    name: Attest exact main release assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: wheel-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the exact artifact built by this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ github.sha }}
          path: release-dist
      - name: Reject missing or additional files before attestation
        run: |
          set -euo pipefail
          test "$(find release-dist -maxdepth 1 -type f | wc -l)" -eq 5
          (cd release-dist && sha256sum --check SHA256SUMS)
      - name: Attest all five release files
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-dist/*

  r-reference:
    name: Base R reference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true
      - name: Run independent R reference
        run: Rscript R/run_suite.R
